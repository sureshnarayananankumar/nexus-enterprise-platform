name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-services:
    name: Java services (build + unit + Testcontainers integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: backend/java-services/**/target/surefire-reports/
          retention-days: 14

  docker-images:
    name: Docker image build (identity-service)
    runs-on: ubuntu-latest
    needs: java-services
    steps:
      - uses: actions/checkout@v4
      - name: Build identity-service image
        run: >
          docker build
          -f infrastructure/docker/java-service.Dockerfile
          --build-arg SERVICE=identity-service
          -t nexus/identity-service:ci
          backend/java-services

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
